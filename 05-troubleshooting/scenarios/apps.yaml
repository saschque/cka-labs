# Broken workloads for task 5.10 – just apply, no spoilers.
apiVersion: v1
kind: Namespace
metadata: {name: broken}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: broken}
spec:
  hard: {requests.memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a1-frontend, namespace: broken}
spec:
  replicas: 1
  selector: {matchLabels: {app: a1-frontend}}
  template:
    metadata: {labels: {app: a1-frontend}}
    spec:
      containers:
        - name: web
          image: ngnix:1.27
          resources: {requests: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a2-api, namespace: broken}
spec:
  replicas: 1
  selector: {matchLabels: {app: a2-api}}
  template:
    metadata: {labels: {app: a2-api}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "cat /config/app.properties && sleep 3600"]
          resources: {requests: {memory: 16Mi}}
          volumeMounts: [{name: config, mountPath: /config}]
      volumes:
        - name: config
          configMap: {name: a2-api-config}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: api-config, namespace: broken}
data:
  app.properties: "mode=prod"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a3-worker, namespace: broken}
spec:
  replicas: 1
  selector: {matchLabels: {app: a3-worker}}
  template:
    metadata: {labels: {app: a3-worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; exit 3"]
          resources: {requests: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a4-cache, namespace: broken}
spec:
  replicas: 1
  selector: {matchLabels: {app: a4-cache}}
  template:
    metadata: {labels: {app: a4-cache}}
    spec:
      tolerations: []
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: redis
          image: redis:7
          resources: {requests: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a5-reports, namespace: broken}
spec:
  replicas: 2
  selector: {matchLabels: {app: a5-reports}}
  template:
    metadata: {labels: {app: a5-reports}}
    spec:
      containers:
        - name: reports
          image: nginx:1.27
          resources: {requests: {memory: 600Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a6-db, namespace: broken}
spec:
  replicas: 1
  selector: {matchLabels: {app: a6-db}}
  template:
    metadata: {labels: {app: a6-db}}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources: {requests: {memory: 16Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: a6-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: a6-data, namespace: broken}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 100Mi}}
