# Workloads with different resource usage for tasks 5.7 and 5.8 – just apply.
apiVersion: v1
kind: Namespace
metadata: {name: load}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cruncher, namespace: load}
spec:
  replicas: 1
  selector: {matchLabels: {app: cruncher}}
  template:
    metadata: {labels: {app: cruncher}}
    spec:
      containers:
        - name: cpu
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources: {requests: {cpu: 50m}, limits: {cpu: 300m}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hoarder, namespace: load}
spec:
  replicas: 1
  selector: {matchLabels: {app: hoarder}}
  template:
    metadata: {labels: {app: hoarder}}
    spec:
      containers:
        - name: mem
          image: polinux/stress
          command: ["stress", "--vm", "1", "--vm-bytes", "120M", "--vm-hang", "0"]
          resources: {limits: {memory: 200Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: idle, namespace: load}
spec:
  replicas: 2
  selector: {matchLabels: {app: idle}}
  template:
    metadata: {labels: {app: idle}}
    spec:
      containers:
        - {name: idle, image: registry.k8s.io/pause:3.10}
---
apiVersion: v1
kind: Pod
metadata: {name: chatter, namespace: load}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date -Iseconds) INFO tick $i\"; [ $((i % 7)) -eq 0 ] && echo \"$(date -Iseconds) ERROR payment gateway timeout id=$i\" >&2; sleep 1; done"]
    - name: audit
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date -Iseconds) AUDIT user=alice action=login\"; sleep 5; done"]
---
apiVersion: v1
kind: Pod
metadata: {name: crasher, namespace: load}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'loading config'; sleep 5; echo 'FATAL: license key expired' >&2; exit 1"]
---
# task 5.11: a deployment whose PDB blocks draining
apiVersion: apps/v1
kind: Deployment
metadata: {name: critical, namespace: load}
spec:
  replicas: 2
  selector: {matchLabels: {app: critical}}
  template:
    metadata: {labels: {app: critical}}
    spec:
      nodeSelector: {kubernetes.io/hostname: cka-worker}
      containers:
        - {name: c, image: registry.k8s.io/pause:3.10}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: critical, namespace: load}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: critical}}
